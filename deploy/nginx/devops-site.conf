# Копия конфигурации ресурса devops.local (Ubuntu 24.04).
# На сервере файл размещается в /etc/nginx/sites-available/devops-site,
# активируется символической ссылкой в /etc/nginx/sites-enabled/.
# Проверка: sudo nginx -t ; применение: sudo systemctl reload nginx
# Сертификат самоподписанный: /etc/ssl/certs/devops.crt, ключ 600 root:root.

# Блок 1: перенаправление HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name devops.local;
    return 301 https://$host$request_uri;
}

# Блок 2: статический ресурс по HTTPS и обратное проксирование приложения
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devops.local;

    ssl_certificate     /etc/ssl/certs/devops.crt;
    ssl_certificate_key /etc/ssl/private/devops.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/devops-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Приложение в контейнере (ПР № 7, задание 3). Завершающий / в proxy_pass
    # заменяет префикс /app/ на /: запрос /app/health передаётся как /health.
    location /app/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
    access_log /var/log/nginx/devops-site.access.log;
    error_log  /var/log/nginx/devops-site.error.log;
}
